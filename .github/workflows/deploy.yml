name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Run Smoke Tests
        run: |
          echo "Running QA suite as smoke tests..."
          python calculator.py

  deploy:
    needs: smoke-test
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Production Deployment
        run: |
          echo "Smoke tests passed perfectly."
          echo "Triggering deployment webhook to hosting platform..."
          echo "Deployment successful! System is live."
